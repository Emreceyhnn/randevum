services:
  randevum:
    build: .
    image: emrecyhn/randevum:latest
    container_name: randevum
    restart: unless-stopped
    environment:
      DATABASE_URL: file:/data/randevum.db
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      CRON_SECRET: ${CRON_SECRET:?CRON_SECRET is required}
      SMS_PROVIDER: ${SMS_PROVIDER:-stub}
      SEED_DEMO: ${SEED_DEMO:-true}
      # Public origin, used for canonical links / sitemap, e.g. https://randevu.example.com
      SITE_URL: ${SITE_URL:-}
      # "landing" = marketing home page at "/", "business" = "/" redirects to the booking page
      SITE_MODE: ${SITE_MODE:-landing}
      GOOGLE_SITE_VERIFICATION: ${GOOGLE_SITE_VERIFICATION:-}
      BING_SITE_VERIFICATION: ${BING_SITE_VERIFICATION:-}
      YANDEX_SITE_VERIFICATION: ${YANDEX_SITE_VERIFICATION:-}
    volumes:
      - randevum-data:/data
    ports:
      # Loopback only: put nginx / a tunnel in front, never expose the app directly.
      - "127.0.0.1:${APP_PORT:-3002}:3000"

volumes:
  randevum-data:
